name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake git make curl xz-utils bzip2 python3
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"

      - name: Install vitasdk (softfp)
        run: |
          git clone --depth 1 https://github.com/vitasdk-softfp/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          ./install-all.sh

      - name: Build
        run: |
          export PATH="$VITASDK/bin:$PATH"
          cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build -j$(nproc)

      # The VPK to install, plus the unstripped executable (so_loader) needed
      # to turn a crash dump (ux0:data/psp2core-*.psp2dmp) into function names.
      - uses: actions/upload-artifact@v4
        with:
          name: Bloons2-${{ matrix.build_type }}
          path: |
            build/Bloons2.vpk
            build/so_loader
